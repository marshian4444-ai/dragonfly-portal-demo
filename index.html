<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1017">
<meta name="robots" content="noindex, nofollow">
<title>Dragonfly Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav + account) and a scrolling workspace; the rail becomes a top strip on phones. */
/* Theme: tweakcn export (light = :root, dark = .dark), mapped onto the portal's tokens.
   background→--bg · card/sidebar→--surface · muted→--surface-2 · foreground→--ink · muted-foreground→--muted
   border→--line · primary→--accent · sidebar-accent→--accent-soft · sidebar-accent-foreground→--accent-strong
   secondary→--gold (key dates, client notes) · shadow→--shadow · radius→--radius */
:root{
  --bg:oklch(0.9833 0.0022 17.1956); --surface:oklch(0.9591 0.0041 17.2293); --surface-2:oklch(0.9201 0.0060 354.7749);
  --ink:oklch(0.2017 0.0526 2.2444); --muted:oklch(0.4862 0.0577 357.8339); --line:oklch(0.8749 0.0182 355.1821);
  /* Purple-forward Sukuna: the theme's secondary (purple) leads, its primary (burgundy) supports */
  --accent:oklch(0.4403 0.1603 303.3730); --accent-ink:oklch(1 0 0); --accent-soft:oklch(0.9300 0.0350 303.3730); --accent-strong:oklch(0.3900 0.1500 303.3730);
  --gold:var(--accent); --gold-soft:var(--accent-soft);
  --radius:8px; --r:var(--radius); --r-sm:6px; --r-lg:12px;
  --tracking:-0.02em;
  --li:#0A66C2; --ig:#B8327E; --ss:#D9530B;
  --s-draft:#64748B; --s-review:#B45309; --s-changes:#B91C1C; --s-sched:#1D4ED8; --s-pub:#15803D;
  --s-review-bg:#FDF1DF; --s-changes-bg:#FBE4E4; --s-sched-bg:#E2E9FB; --s-pub-bg:#DFF3E5; --s-draft-bg:#EBEEF2;
  --shadow:0px 4px 10px 0px hsl(345 80% 10% / 0.10),0px 1px 2px -1px hsl(345 80% 10% / 0.10);
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(0.1243 0.0149 354.3898); --surface:oklch(0.1616 0.0199 357.9730); --surface-2:oklch(0.2251 0.0315 358.4161);
  --ink:oklch(0.8831 0.0200 48.4846); --muted:oklch(0.7075 0.0340 355.9324); --line:oklch(0.2549 0.0382 358.6888);
  --accent:oklch(0.6500 0.1900 305.6795); --accent-ink:oklch(0.1243 0.0149 354.3898); --accent-soft:oklch(0.2600 0.0700 305.6795); --accent-strong:oklch(0.7800 0.1300 305.6795);
  --gold:var(--accent); --gold-soft:var(--accent-soft);
  --li:#5AA5F0; --ig:#E77BB8; --ss:#FF8D4F;
  --s-draft:#94A3B8; --s-review:#F2A541; --s-changes:#F27A7A; --s-sched:#7FA3FF; --s-pub:#55CB7E;
  --s-review-bg:#33250F; --s-changes-bg:#3A1A1A; --s-sched-bg:#17254A; --s-pub-bg:#123323; --s-draft-bg:#1C2838;
  --shadow:0px 10px 20px 2px hsl(0 100% 0% / 0.60),0px 1px 2px 1px hsl(0 100% 0% / 0.60); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:oklch(0.1243 0.0149 354.3898); --surface:oklch(0.1616 0.0199 357.9730); --surface-2:oklch(0.2251 0.0315 358.4161);
  --ink:oklch(0.8831 0.0200 48.4846); --muted:oklch(0.7075 0.0340 355.9324); --line:oklch(0.2549 0.0382 358.6888);
  --accent:oklch(0.6500 0.1900 305.6795); --accent-ink:oklch(0.1243 0.0149 354.3898); --accent-soft:oklch(0.2600 0.0700 305.6795); --accent-strong:oklch(0.7800 0.1300 305.6795);
  --gold:var(--accent); --gold-soft:var(--accent-soft);
  --li:#5AA5F0; --ig:#E77BB8; --ss:#FF8D4F;
  --s-draft:#94A3B8; --s-review:#F2A541; --s-changes:#F27A7A; --s-sched:#7FA3FF; --s-pub:#55CB7E;
  --s-review-bg:#33250F; --s-changes-bg:#3A1A1A; --s-sched-bg:#17254A; --s-pub-bg:#123323; --s-draft-bg:#1C2838;
  --shadow:0px 10px 20px 2px hsl(0 100% 0% / 0.60),0px 1px 2px 1px hsl(0 100% 0% / 0.60); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;letter-spacing:var(--tracking);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:21px;line-height:1.25}
h3{font-size:16px;font-family:var(--f-body);font-weight:700;letter-spacing:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:oklch(0.1243 0.0149 354.3898);color:oklch(0.9223 0.0131 48.5794);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.paths{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.paths svg{position:absolute;inset:0;width:100%;height:100%}
.paths path{fill:none;stroke:currentColor;stroke-dasharray:.5 .5;animation:flow linear infinite}
.paths .p1{color:oklch(0.6500 0.1900 305.6795)}.paths .p2{color:oklch(0.5655 0.2229 18.5160)}
@keyframes flow{to{stroke-dashoffset:-1}}
.login-art::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,oklch(0.1243 0.0149 354.3898) 15%,oklch(0.1243 0.0149 354.3898 / 0));pointer-events:none}
.login-art > *{position:relative;z-index:1}
.login-art > .paths{position:absolute;z-index:0}
.login-art blockquote{margin:0;max-width:40ch}
.login-art blockquote p{font-family:var(--f-display);font-size:24px;line-height:1.3;color:#fff}
.login-art blockquote footer{margin-top:10px;font-size:13px;color:oklch(0.7075 0.0340 355.9324)}
.login-head{display:flex;flex-direction:column;gap:6px}
.login-head .mark{color:var(--accent);margin-bottom:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fine{font-size:12px;color:var(--muted);line-height:1.5}
.login-art h1{font-size:44px;color:#fff;max-width:14ch}
.login-art .sub{color:oklch(0.7075 0.0340 355.9324);max-width:42ch;font-size:15px}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding:48px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.login-form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;width:100%}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:76px;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none}
.ns{display:none}
@media (max-width:860px){.nav .ns,.seg .ns{display:inline}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--s-changes);border-color:color-mix(in srgb,var(--s-changes) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:var(--r-sm)}
.err{color:var(--s-changes);font-size:13px;min-height:20px}
.demo-hint{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .name{font-family:var(--f-display);font-size:18px;line-height:1.1}
.brand .name small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.nav a svg{width:18px;height:18px;flex:none;stroke:var(--muted)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-strong)}
.nav a.on svg{stroke:var(--accent-strong)}
.nav .t-badge{position:relative;top:auto;right:auto;margin-left:auto}
.nav .t-badge-dot{background:var(--s-review);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px;font-family:var(--f-mono)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent);color:var(--accent-ink);flex:none;font-family:var(--f-display);letter-spacing:.02em}
.who .meta{min-width:0}
.who .meta b{display:block;font-size:13px}
.who .meta span{font-size:12px;color:var(--muted)}

.main{min-width:0;padding:24px 32px 64px}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:24px}
.seg{position:relative;display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:6px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--muted);transition:color var(--tabs-dur) var(--tabs-ease)}
.seg button:hover,.seg button.on{color:var(--ink)}
.demo-banner{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:5px 12px;font-weight:600}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.page-head p{color:var(--muted);margin-top:6px;max-width:62ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:16px;flex-wrap:wrap}

/* KPI tiles */
.kpi .val{font-family:var(--f-body);font-weight:600;letter-spacing:-0.03em;font-size:32px;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12.5px;font-weight:600;margin-top:4px}
.up{color:var(--s-pub)} .down{color:var(--s-changes)}
.kpi .spark{margin-top:16px;display:block;width:100%;height:40px}
.chunk{display:flex;flex-direction:column;gap:8px}
.chunk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.chunk-h .muted{font-size:12px}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.kpi-main .val{font-size:56px;letter-spacing:-0.04em}
.kpi-main .delta{font-size:14px}
.kpi-main .spark{height:96px;margin-top:24px}
.kpi-side{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.kpi-mini{padding:16px 24px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:center}
.kpi-mini + .kpi-mini{border-top:1px solid var(--line)}
.kpi-mini .v,.momentum .v{font-size:24px;font-weight:600;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi-mini .v .muted,.momentum .v .muted{font-size:14px;font-weight:500;letter-spacing:0}
.kpi-mini .spark{width:120px;height:32px;margin:0;flex:none}
.kpi-mini .progress,.momentum .progress{margin-top:0}
.s{font-size:12px}
.momentum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.momentum > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.momentum > div + div{border-left:1px solid var(--line);padding-left:24px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:16px;height:6px;border-radius:99px;background:var(--accent)}
.skills{display:flex;gap:4px;flex-wrap:wrap}
.skill{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 8px;color:var(--muted)}
.skill.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
@media (max-width:860px){.hero,.momentum{grid-template-columns:minmax(0,1fr)}.momentum > div + div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}.kpi-main .val{font-size:44px}}

/* Status + channel chips */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.pill[class*="st-"],.pill[class*="rel-"]{background:transparent!important;color:var(--ink)!important}
.pill.st-draft::before{background:var(--s-draft)}.pill.st-review::before{background:var(--s-review)}.pill.st-changes::before{background:var(--s-changes)}.pill.st-scheduled::before{background:var(--s-sched)}.pill.st-published::before{background:var(--s-pub)}
.pill.rel-High::before{background:var(--accent)}.pill.rel-Medium::before{background:var(--muted)}.pill.rel-Low::before{background:var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{color:var(--s-draft);background:var(--s-draft-bg)}
.st-review{color:var(--s-review);background:var(--s-review-bg)}
.st-changes{color:var(--s-changes);background:var(--s-changes-bg)}
.st-scheduled{color:var(--s-sched);background:var(--s-sched-bg)}
.st-published{color:var(--s-pub);background:var(--s-pub-bg)}
.ch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.ch i{width:9px;height:9px;border-radius:3px;display:inline-block}
.ch-li i{background:var(--li)} .ch-ig i{background:var(--ig)} .ch-ss i{background:var(--ss)}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 7px;color:var(--muted);white-space:nowrap}

/* Lists */
.list{display:flex;flex-direction:column}
.li-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li-row:first-child{border-top:0}
button.li-row:hover{background:var(--surface-2);border-radius:var(--r-sm)}
.li-row .when{font-size:12px;color:var(--muted);line-height:1.3}
.li-row .when b{display:block;color:var(--ink);font-size:13px}
.li-row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-row .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Attention banner */
.attn{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-lg);padding:16px 24px}
.attn b{color:var(--ink);font-size:16px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal .day{background:var(--surface);min-height:118px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day.out{background:var(--bg)}
.cal .day.out .dn{opacity:.4}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-size:12px;font-weight:700;font-family:var(--f-mono);color:var(--muted)}
.cal .day.today .dn{color:var(--accent)}
.kd{font-size:11px;color:var(--gold);font-weight:600;display:flex;gap:4px;align-items:flex-start;line-height:1.25;background:none;border:0;padding:0;text-align:left}
.kd::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--gold);flex:none;margin-top:4px}
.chip{display:flex;gap:6px;align-items:center;border:0;text-align:left;width:100%;padding:4px 6px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;background:var(--surface-2);min-width:0}
.chip:hover{filter:brightness(.97)}
.chip i{width:3px;align-self:stretch;border-radius:2px;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .sd{width:7px;height:7px;border-radius:50%;flex:none;margin-left:auto}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12px;color:var(--muted)}
.cal-agenda{display:none}

/* Approvals */
.appr{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px}
.appr + .appr{margin-top:16px}
.appr-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.caption{white-space:pre-wrap;font-size:14px;line-height:1.6;max-width:65ch}
.thread{display:flex;flex-direction:column;gap:8px}
.note{background:var(--surface-2);border-radius:var(--r);padding:9px 12px;font-size:13px}
.note .by{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.note.client{background:var(--gold-soft)}

/* Previews (brand colours come from the Brand Hub) */
.pv{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);font-size:13px}
.pv-head{display:flex;gap:9px;align-items:center;padding:10px 12px}
.pv-head .avatar{width:30px;height:30px;font-size:11px}
.pv-head b{font-size:13px;display:block;line-height:1.2}
.pv-head span{font-size:11.5px;color:var(--muted)}
.pv-sq{aspect-ratio:1/1;max-width:100%;background:var(--b1);color:var(--b2);padding:22px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.pv-sq .ttl{font-family:var(--bf-d,var(--f-display));font-size:24px;line-height:1.15;max-width:15ch}
.pv-sq .mark{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--b3);font-weight:700}
.pv-sq .rule{width:44px;height:2px;background:var(--b3)}

function pickMenu(kind,forId){

/* ================= SPARKLINE ================= */
function spark(vals,color,w=240,h=40){
 const mn=Math.min(...vals),mx=Math.max(...vals),pad=4,rng=(mx-mn)||1;
 const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1),h-pad-(v-mn)/rng*(h-2*pad)]);
 const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
 const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
 const e=pts[pts.length-1];
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="3" fill="${color}"/></svg>`;
}

 const sec=(id,title,view,edit)=>`<div class="card"><div class="card-head"><h2>${title}</h2>${ed===id?`<div class="row"><button class="btn sm ghost" data-cancel>Cancel</button><button class="btn sm primary" data-save="${id}">Save ${NOUN[id]}</button></div>`:`<button class="btn sm" data-edit="${id}">Edit ${NOUN[id]}</button>`}</div>${ed===id?edit:view}</div>`;
 return `
 <div class="page-head"><div><div class="eyebrow">Brand hub</div><h1>The source of truth</h1><p>Everything we use to write and design for you. Edit anything here, and every new post follows it. Items marked as proposals need your confirmation.</p></div></div>
 <div class="stack">
 ${sec("colors","Colours <span class='tag' style='font-family:var(--f-body)'>Proposal · to confirm</span>",
  `<div class="swatches">${b.colors.map(c=>`<div class="sw"><div class="chipc" style="background:${esc(c.h)}"></div><div class="lab"><b>${esc(c.n)}</b><span class="mono">${esc(c.h.toUpperCase())}</span><div class="muted">${esc(c.use)}</div></div></div>`).join("")}</div><p class="muted" style="font-size:12.5px;margin-top:10px">These colours drive the post previews across the portal. Change one and the previews update.</p>`,
  `<div class="swatches">${b.colors.map((c,i)=>`<div class="sw editing"><input type="color" id="col-${i}" value="${esc(c.h)}" aria-label="${esc(c.n)} colour"><div class="lab"><div class="pick-lbl">Colour</div>${pickField("coln-"+i,c.n,"cname","Colour name")}<div class="pick-lbl" style="margin-top:8px">Used for</div>${pickField("colu-"+i,c.use,"cuse","Used for")}</div></div>`).join("")}</div><p class="muted" style="font-size:12.5px;margin-top:10px">Click a name or a role to choose from the options, or type your own. The colour bar on top opens a full colour picker.</p>`)}
 <div class="grid g-2">
 ${sec("fonts","Typography",
  `<div class="type-sample"><div class="eyebrow">Headlines</div><div style="font-family:var(--bf-d);font-size:28px;line-height:1.15">Strategy for Systems in Motion</div><div class="muted mono" style="font-size:12px">${esc(b.fonts.display)}</div><div class="eyebrow" style="margin-top:10px">Body</div><div style="font-family:var(--bf-b)">Global strategy at the intersection of markets and ideas.</div><div class="muted mono" style="font-size:12px">${esc(b.fonts.body)}</div><p class="muted" style="font-size:12.5px;margin-top:8px">${esc(b.fonts.note)}</p></div>`,
  `<div class="stack" style="gap:10px"><div class="field"><label for="f-d">Headline font</label>${pickField("f-d",b.fonts.display,"fd","Headline font")}<div id="f-d-prev" class="type-live" style="font-family:${esc(fontStack(b.fonts.display))};font-size:24px;line-height:1.15">Strategy for Systems in Motion</div></div><div class="field"><label for="f-b">Body font</label>${pickField("f-b",b.fonts.body,"fb","Body font")}<div id="f-b-prev" class="type-live" style="font-family:${esc(fontStack(b.fonts.body))}">Global strategy at the intersection of markets and ideas.</div></div><div class="field"><label for="f-n">Notes</label><textarea class="input" id="f-n">${esc(b.fonts.note)}</textarea></div></div>`)}
 ${sec("links","Links",
  `<ul class="edit-list">${b.links.map(l=>`<li><div style="min-width:0"><b>${esc(l.n)}</b><div style="overflow-wrap:anywhere"><a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.u.replace(/^https?:\/\/(www\.)?/,""))}</a></div></div></li>`).join("")}</ul>`,
  `<div class="field"><label for="links-ta">One link per line, as: Name | URL</label><textarea class="input" id="links-ta" style="min-height:150px">${esc(b.links.map(l=>l.n+" | "+l.u).join("\n"))}</textarea></div>`)}
 </div>
 ${sec("bio","Official biography <span class='tag' style='font-family:var(--f-body)'>Draft · for Alex's approval</span>",
  `<div class="stack" style="gap:12px"><div><div class="eyebrow">Tagline</div><div style="font-family:var(--f-display);font-size:20px">${esc(b.tagline)}</div></div><div><div class="eyebrow">Headline (LinkedIn, speaker cards)</div><div style="font-weight:600">${esc(b.headline)}</div></div><div><div class="eyebrow">Long bio</div><div class="caption">${esc(b.bio)}</div></div><div class="row"><button class="btn sm" data-copy="bio">Copy long bio</button></div></div>`,
  `<div class="stack" style="gap:10px"><div class="field"><label for="b-t">Tagline</label><input class="input" id="b-t" value="${esc(b.tagline)}"></div><div class="field"><label for="b-h">Headline</label><input class="input" id="b-h" value="${esc(b.headline)}"></div><div class="field"><label for="b-b">Long bio</label><textarea class="input" id="b-b" style="min-height:220px">${esc(b.bio)}</textarea></div></div>`)}
 <div class="grid g-2">
 ${sec("highlights","Career highlights",
  `<ul class="edit-list">${b.highlights.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>`,
  `<div class="field"><label for="hl-ta">One highlight per line</label><textarea class="input" id="hl-ta" style="min-height:180px">${esc(b.highlights.join("\n"))}</textarea></div>`)}
 ${sec("press","Press & features",
  `<ul class="edit-list">${b.press.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>`,
  `<div class="field"><label for="pr-ta">One item per line</label><textarea class="input" id="pr-ta" style="min-height:180px">${esc(b.press.join("\n"))}</textarea></div>`)}
 </div>
 ${sec("testimonials","Testimonials",
  b.testimonials.length?`<div class="stack">${b.testimonials.map(t=>`<div class="testi"><q>${esc(t.q)}</q><div class="muted" style="font-size:13px;margin-top:4px">${esc(t.who)}</div></div>`).join("")}</div>`:`<div class="empty">No testimonials yet. In December we'll collect three short quotes from partners, students and event hosts, with their permission. Add any you already have with Edit.</div>`,
  `<div class="field"><label for="te-ta">One per line, as: Quote | Name, role</label><textarea class="input" id="te-ta" style="min-height:140px" placeholder="Working with Alex changed how our team talks about our brand. | Name, Title, Organisation">${esc(b.testimonials.map(t=>t.q+" | "+t.who).join("\n"))}</textarea></div>`)}
 </div>`;
}

/* ================= DRAWER ================= */
function openPost(id){
 const p=S.posts.find(x=>x.id===id); if(!p) return;
 closeDrawer();
 const sc=document.createElement("div");sc.className="scrim";sc.addEventListener("click",closeDrawer);
 const dr=document.createElement("aside");dr.className="drawer";dr.setAttribute("role","dialog");dr.setAttribute("aria-label",p.title);
 dr.innerHTML=`<div class="row between"><div class="row">${chTag(p)}<span class="tag">${ACCT[p.a]}</span>${stPill(p.status)}</div><button class="btn ghost sm" data-close aria-label="Close">Close ✕</button></div>
 <h2>${esc(p.title)}</h2><div class="muted mono" style="font-size:12.5px">${fd(p.d)} · ${p.t} Lisbon · ${esc(p.fmt)} · ${esc(p.pillar)}</div>
 ${p.m?`<div class="metrics"><div class="metric"><b>${n0(p.m.imp)}</b><span>Reach</span></div><div class="metric"><b>${n0(p.m.eng)}</b><span>Engagements</span></div><div class="metric"><b>${p.m.cmt}</b><span>Comments</span></div><div class="metric"><b>${er(p).toFixed(1)}%</b><span>Eng. rate</span></div></div>`:""}
 ${preview(p,true)}
 <div class="thread">${(p.notes||[]).map(noteHtml).join("")}</div>
 ${p.status==="published"?`<div class="muted" style="font-size:13px">Published. Notes here go into next month's report.</div>`:""}
 ${p.status==="review"?`<div class="stack" style="gap:8px"><label class="eyebrow" for="n-${p.id}">Note to Dragonfly</label><textarea class="input" id="n-${p.id}" placeholder="What would you like changed?"></textarea><div class="row"><button class="btn primary" data-act="approve" data-id="${p.id}">Approve post</button><button class="btn danger" data-act="changes" data-id="${p.id}">Request changes</button></div></div>`:actions(p)}`;
 dr.addEventListener("click",onClick);
 document.body.append(sc,dr);
 void dr.offsetWidth; sc.dataset.open="true"; dr.dataset.open="true";
 const c=dr.querySelector("[data-close]"); c&&c.focus();
}
function closeDrawer(){document.querySelectorAll(".scrim:not(.closing),.drawer:not(.closing)").forEach(e=>{e.classList.add("closing");e.dataset.open="false";setTimeout(()=>e.remove(),380)})}

/* ================= RENDER ================= */
function route(){const h=(location.hash||"").slice(1);return ROUTES.some(r=>r[0]===h)?h:"overview"}
function render(){
 applyBrandVars();
 captureSegs();
 const app=$("#app");
 if(!S.auth){lastRoute=null;prevReview=null;app.innerHTML=loginHtml();bindLogin();return}
 const r=route();
 const reviewN=S.posts.filter(p=>p.status==="review").length;
 const changed=prevReview!==reviewN;
 let badge="";
 if(reviewN>0||(changed&&prevReview>0)){
  const shown=reviewN>0?reviewN:prevReview, startOpen=!changed||reviewN===0;
  badge=`<span class="t-badge" data-open="${startOpen}" ${startOpen?"data-static":""}><span class="t-badge-dot">${shown}</span></span>`;
 }
 const enter=r!==lastRoute;
 const views={overview:vOverview,calendar:vCalendar,approvals:vApprovals,analytics:vAnalytics,dates:vDates,brand:vBrand};
 app.innerHTML=`<div class="shell">
 <nav class="rail" aria-label="Main">
  <div class="brand"><span style="color:var(--accent)">${DRAGONFLY}</span><div class="name">Dragonfly Media<small>Client portal</small></div></div>
  <div class="nav">${ROUTES.map(([k,l])=>`<a href="#${k}" class="${r===k?"on":""}" ${r===k?'aria-current="page"':""}>${ICON[k]}<span class="nl">${l}</span><span class="ns">${SHORT[k]}</span>${k==="approvals"?badge:""}</a>`).join("")}</div>
  <div class="rail-foot"><div class="who"><div class="avatar">AR</div><div class="meta"><b>Alex Rivera</b><span>Demo client · Lisbon</span></div></div>
  <button class="btn sm ghost" data-reset title="Restore the original demo content">Reset demo</button><button class="btn sm" data-logout>Log out</button><div class="muted" style="font-size:11px;padding:0 8px">Managed by Dragonfly Media by Martin</div></div>
 </nav>
 <main class="main">
  <div class="topbar"><div class="seg" data-seg="acct" aria-label="Show content for"><span class="seg-pill" aria-hidden="true"></span>${[["all","Everything","All"],["lead","Alex Rivera","Alex"],["org","Northlight Collective","Studio"]].map(([k,l,sh])=>`<button class="${S.acct===k?"on":""}" data-acct="${k}" aria-label="${l}"><span class="nl">${l}</span><span class="ns">${sh}</span></button>`).join("")}</div>
  <span class="demo-banner">Demo · sample content for December 2026</span></div>
  <div class="t-view" data-in="${enter?"false":"true"}">${views[r]()}</div>
 </main></div>`;
 lastRoute=r; prevReview=reviewN;
 const g=$("#gnote-form"); if(g) g.addEventListener("submit",e=>{e.preventDefault();const v=$("#gnote").value.trim();if(!v)return;S.notes.push({by:"Alex",client:true,text:v,at:nowStamp()});save();render();toast("Note sent to Dragonfly",true)});
 afterRender(reviewN);
}
function loginHtml(){
 return `<div class="login">
 <div class="login-art"><div class="paths" id="paths" aria-hidden="true"></div>
  <div class="row" style="color:oklch(0.7800 0.1300 305.6795)">${DRAGONFLY}<span style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:oklch(0.8831 0.0200 48.4846)">Dragonfly Media by Martin</span></div>
  <div class="t-stagger" id="lstag"><h1 class="t-stagger-line">Your voice, everywhere it matters.</h1><p class="sub t-stagger-line t-stagger-line--2" style="margin-top:14px">One private place to see what's coming, approve what goes out, and read how it's landing across LinkedIn, Instagram, Substack and Northlight Collective.</p></div>
  <blockquote><p>&ldquo;Brands people repeat.&rdquo;</p><footer>Alex Rivera · Founder, Northlight Collective (demo client)</footer></blockquote>
 </div>
 <div class="login-form-wrap"><form class="login-form" id="login" autocomplete="on">
  <div class="login-head"><span class="mark">${DRAGONFLY}</span><h2 style="font-size:28px">Sign in to your portal</h2><p class="muted">Log in to see what's coming, approve content and track results.</p></div>
  <div class="t-input-wrap stack" id="lwrap" style="gap:16px">
  <div class="field"><label for="u">Username</label><input class="input t-input" id="u" autocomplete="username" required></div>
  <div class="field"><label for="pw">Password</label><input class="input t-input" id="pw" type="password" autocomplete="current-password" required></div>
  <div class="err t-error-msg" id="lerr" role="alert"></div></div>
  <button class="btn primary" type="submit" style="padding:12px">Open my portal</button>
  <div class="or">Demo access</div>
  <div class="demo-hint">Username <b class="mono">demo</b> · password <b class="mono">demo2026</b></div>
  <p class="fine">Demo portal with a fictional client. All names and figures are illustrative. Account passwords are never stored here.</p>
 </form></div></div>`;
}
function bindLogin(){
 $("#login").addEventListener("submit",e=>{e.preventDefault();
  if($("#u").value.trim().toLowerCase()===LOGIN.user&&$("#pw").value===LOGIN.pass){S.auth=true;save();if(!location.hash)location.hash="overview";render();window.scrollTo(0,0)}
  else{loginError()}
 });
 const wrap=$("#lwrap");
 wrap.addEventListener("input",()=>{clearTimeout(wrap._t);wrap.classList.remove("is-error");wrap.querySelectorAll(".t-input").forEach(i=>i.classList.remove("is-error"))});
 drawPaths();
 const st=$("#lstag"); if(st){void st.offsetHeight;requestAnimationFrame(()=>st.classList.add("is-shown"))}
}
// transitions.dev error state shake
function loginError(){
 const wrap=$("#lwrap"),ins=[...wrap.querySelectorAll(".t-input")];
 $("#lerr").textContent="That username and password don't match. Check the demo details below.";
 wrap.classList.add("is-error");
 ins.forEach(i=>{i.classList.add("is-error");i.classList.remove("is-shaking");void i.offsetWidth;i.classList.add("is-shaking")});
 setTimeout(()=>ins.forEach(i=>i.classList.remove("is-shaking")),300);
 clearTimeout(wrap._t);
 wrap._t=setTimeout(()=>{wrap.classList.remove("is-error");ins.forEach(i=>i.classList.remove("is-error"))},3280);
}
// Floating-paths background, as in the AuthPage block: two mirrored layers of 36 curves drifting along their length.
function drawPaths(){
 const host=$("#paths"); if(!host) return;
 let out="";
 [[1,"p1"],[-1,"p2"]].forEach(([pos,cls])=>{
  out+=`<svg class="${cls}" viewBox="0 0 696 316" preserveAspectRatio="xMidYMid slice">`;
  for(let i=0;i<36;i++){
   const a=380-i*5*pos,b=189+i*6,c=312-i*5*pos,d=216-i*6,e=152-i*5*pos,f=343-i*6,g=616-i*5*pos,h=470-i*6,k=684-i*5*pos,l=875-i*6;
   out+=`<path pathLength="1" d="M${-a} ${-b}C${-a} ${-b} ${-c} ${d} ${e} ${f}C${g} ${h} ${k} ${l} ${k} ${l}" stroke-width="${(0.5+i*0.03).toFixed(2)}" stroke-opacity="${(0.06+i*0.014).toFixed(3)}" style="animation-duration:${20+(i*7)%10}s"/>`;
  }
  out+=`</svg>`;
 });
 host.innerHTML=out;
}

/* ================= EVENTS ================= */
function onClick(e){
 const t=e.target.closest("button,a,tr"); if(!t) return;
 const d=t.dataset;
 if(d.open){e.preventDefault();openPost(d.open);return}
 if(d.close!==undefined){closeDrawer();return}
 if(d.act){
  const p=S.posts.find(x=>x.id===d.id), ta=document.getElementById("n-"+d.id), note=ta?ta.value.trim():"";
  if(d.act==="changes"&&!note){ta&&ta.focus();ta&&(ta.placeholder="Add a short note so we know what to change.");toast("Add a note first so we know what to change");return}
  if(note)(p.notes=p.notes||[]).push({by:"Alex",client:true,text:note,at:nowStamp()});
  if(d.act==="approve"){p.status="scheduled";toast("Approved. It goes live "+fd(p.d)+" at "+p.t,true)}
  if(d.act==="changes"){p.status="changes";toast("Sent to Dragonfly. New version within one working day")}
  if(d.act==="unapprove"){p.status="review";toast("Moved back to review")}
  if(d.act==="note"){if(!note){toast("Write a note first");return}toast("Note added")}
  save();closeDrawer();render();return;
 }
 if(d.tab){S.apprTab=d.tab;save();render();return}
 if(d.acct){S.acct=d.acct;save();render();return}
 if(d.cal){const [y,m]=S.calMonth;if(d.cal==="0")S.calMonth=[2026,11];else{const n=new Date(y,m+Number(d.cal),1);S.calMonth=[n.getFullYear(),n.getMonth()]}save();render();return}
 if(d.kdf){S.kdFilter=d.kdf;render();return}
 if(d.req){const k=KEY_DATES.find(x=>x.d===d.req);const id="r"+Date.now();
  S.posts.push({id,d:k.d,t:"09:00",ch:"li",a:/Northlight|studio|Studio/.test(k.name+k.idea)?"org":"lead",fmt:"Text post",pillar:"Key date",status:"draft",fromKD:true,title:k.idea,body:"Requested from Key dates: "+k.name+".\n\nDragonfly is drafting this post. It will move to your review queue when ready.",notes:[{by:"Alex",client:true,text:"Requested from Key dates.",at:nowStamp()}]});
  save();render();toast("Requested. Dragonfly will draft it for "+fd(k.d));return}
 if(d.edit){S.editing=d.edit;render();return}
 if(d.cancel!==undefined){S.editing="";render();return}
 if(d.save){saveBrand(d.save);S.editing="";save();render();toast("Brand hub updated");return}
 if(d.copy){const txt=S.brand.bio;try{navigator.clipboard.writeText(txt).then(()=>toast("Bio copied"),()=>toast("Copy blocked here. Select the text instead"))}catch(err){toast("Copy blocked here. Select the text instead")}return}
 if(d.logout!==undefined){S.auth=false;save();closeDrawer();render();return}
 if(d.reset!==undefined){const a=S.auth;S=fresh();S.auth=a;save();render();toast("Demo content restored");return}
}
function lines(id){return document.getElementById(id).value.split("\n").map(s=>s.trim()).filter(Boolean)}
function saveBrand(id){
 const b=S.brand;
 if(id==="colors") b.colors=b.colors.map((c,i)=>({n:$("#coln-"+i).value||c.n,h:$("#col-"+i).value,use:$("#colu-"+i).value}));
 if(id==="fonts") b.fonts={display:$("#f-d").value,body:$("#f-b").value,note:$("#f-n").value};
 if(id==="bio"){b.tagline=$("#b-t").value;b.headline=$("#b-h").value;b.bio=$("#b-b").value}
 if(id==="highlights") b.highlights=lines("hl-ta");
 if(id==="press") b.press=lines("pr-ta");
 if(id==="links") b.links=lines("links-ta").map(l=>{const [n,u]=l.split("|").map(s=>s.trim());return {n:n||u,u:/^https?:/.test(u||"")?u:"https://"+(u||n)}});
 if(id==="testimonials") b.testimonials=lines("te-ta").map(l=>{const [q,w]=l.split("|").map(s=>s.trim());return {q,who:w||""}});
}
document.addEventListener("click",e=>{if(handlePick(e))return;if(e.target.closest(".drawer"))return;onClick(e)});
document.addEventListener("input",e=>syncFontPrev(e.target));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.querySelector(".pick-menu")){closePicks();return}closeDrawer()}});
window.addEventListener("hashchange",()=>{closeDrawer();render();window.scrollTo(0,0)});
window.addEventListener("resize",()=>{Object.keys(segPrev).forEach(k=>delete segPrev[k]);placeSegs()});
render();
})();
</script>

</html>
